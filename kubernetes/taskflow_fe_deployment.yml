apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-fe-deployment
  labels:
    app: taskflow-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-fe
  template:
    metadata:
      labels:
        app: taskflow-fe
    spec:
      containers:
      - name: taskflow-fe
        image: souravsahoo08/microservice-k8-frontend:v1.0
        ports:
        - containerPort: 80
